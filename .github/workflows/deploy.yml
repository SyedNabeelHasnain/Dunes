name: Deploy Laravel Application to Hostinger

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Parse FTP Server Host
      id: ftp_server
      run: |
        SERVER_HOST="${{ vars.FTP_SERVER }}"
        SERVER_HOST="${SERVER_HOST#ftp://}"
        SERVER_HOST="${SERVER_HOST#ftps://}"
        echo "host=$SERVER_HOST" >> $GITHUB_OUTPUT

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install NPM dependencies & Build Assets
      run: |
        npm ci
        npm run build

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, mysql, openssl
        cache-control: no-cache
        coverage: none

    - name: Install Composer dependencies
      run: |
        composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

    - name: Create Deploy Directories
      run: |
        mkdir -p deploy/public_deploy
        mkdir -p deploy/core_deploy

    - name: Prepare Public Assets Staging
      run: |
        # Copy public files to staging (including hidden files like .htaccess)
        cp -r public/. deploy/public_deploy/
        
        # Remove images directory from staging to keep the zip small and prevent re-uploading
        rm -rf deploy/public_deploy/images
        
        # Adjust paths in entry points to point to dunes-laravel directory
        for f in index.php ajax.php debug_artisan.php; do
          if [ -f "deploy/public_deploy/$f" ]; then
            sed -i "s|__DIR__.'/../storage/framework/maintenance.php'|__DIR__.'/../dunes-laravel/storage/framework/maintenance.php'|g" "deploy/public_deploy/$f"
            sed -i "s|__DIR__.'/../vendor/autoload.php'|__DIR__.'/../dunes-laravel/vendor/autoload.php'|g" "deploy/public_deploy/$f"
            sed -i "s|__DIR__.'/../bootstrap/app.php'|__DIR__.'/../dunes-laravel/bootstrap/app.php'|g" "deploy/public_deploy/$f"
          fi
        done

        # Package public assets into a zip, excluding unzip.php
        cd deploy/public_deploy
        zip -r ../public.zip . -x unzip.php
        cd ../..

        # Clean staging and place only public.zip and unzip.php
        rm -rf deploy/public_deploy/*
        mv deploy/public.zip deploy/public_deploy/public.zip
        cp public/unzip.php deploy/public_deploy/unzip.php

    - name: Prepare Core Code Staging
      env:
        DB_PASS: ${{ secrets.DB_PASSWORD || vars.DB_PASSWORD || 'P@kistanZindaBad123!@#' }}
      run: |
        # Generate the .env file in the runner from .env.example
        cp .env.example .env
        php artisan key:generate

        # Populate database credentials dynamically from secrets/vars with hardcoded fallbacks
        sed -i "s|DB_HOST=127.0.0.1|DB_HOST=${{ vars.DB_HOST || secrets.DB_HOST || 'localhost' }}|g" .env
        sed -i "s|DB_DATABASE=u410503041_ddtlaravel|DB_DATABASE=${{ vars.DB_NAME || secrets.DB_NAME || 'u410503041_ddtlaravel' }}|g" .env
        sed -i "s|DB_USERNAME=u410503041_ddtlaravel|DB_USERNAME=${{ vars.DB_USER || secrets.DB_USER || 'u410503041_ddtlaravel' }}|g" .env
        # Quote the password to protect # from dotenv comment parsing
        sed -i '/^DB_PASSWORD=/d' .env
        printf 'DB_PASSWORD="%s"\n' "$DB_PASS" >> .env

        # Copy core Laravel directories and files, excluding public assets, node_modules, compiled views and git history
        rsync -arv --exclude="public" --exclude="node_modules" --exclude=".git" --exclude=".github" --exclude="deploy" --exclude="storage/framework/views/*" --exclude="storage/framework/cache/*" --exclude="storage/logs/*" ./ deploy/core_deploy/

        # Package core files into a zip
        cd deploy/core_deploy
        zip -r ../core.zip .
        cd ../..

        # Clean staging and place only core.zip
        rm -rf deploy/core_deploy/*
        mv deploy/core.zip deploy/core_deploy/core.zip

    - name: Install SSHPass
      run: sudo apt-get update && sudo apt-get install -y sshpass

    - name: Prepare Remote Directories (Clean Slate)
      continue-on-error: true
      env:
        SSHPASS: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
      run: |
        for i in 1 2 3; do
          sshpass -e ssh -p 65002 -o StrictHostKeyChecking=no -o ConnectTimeout=15 u410503041@${{ steps.ftp_server.outputs.host }} "mkdir -p /home/u410503041/domains/dunesdiscoverytourism.com/public_html /home/u410503041/domains/dunesdiscoverytourism.com/dunes-laravel /home/u410503041/public_html && chmod -R 0777 /home/u410503041/domains/dunesdiscoverytourism.com/public_html /home/u410503041/domains/dunesdiscoverytourism.com/dunes-laravel /home/u410503041/public_html" && \
          sshpass -e ssh -p 65002 -o StrictHostKeyChecking=no -o ConnectTimeout=15 u410503041@${{ steps.ftp_server.outputs.host }} "find /home/u410503041/domains/dunesdiscoverytourism.com/public_html -mindepth 1 -maxdepth 1 ! -name 'images' -exec rm -rf {} +" && \
          sshpass -e ssh -p 65002 -o StrictHostKeyChecking=no -o ConnectTimeout=15 u410503041@${{ steps.ftp_server.outputs.host }} "find /home/u410503041/domains/dunesdiscoverytourism.com/dunes-laravel -mindepth 1 -maxdepth 1 ! -name 'storage' ! -name '.env' -exec rm -rf {} +" && break || sleep 5
        done

    - name: Upload Public Assets (SCP)
      env:
        SSHPASS: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
      run: |
        for i in 1 2 3; do
          sshpass -e scp -O -P 65002 -o StrictHostKeyChecking=no -o ConnectTimeout=15 deploy/public_deploy/public.zip deploy/public_deploy/unzip.php u410503041@${{ steps.ftp_server.outputs.host }}:/home/u410503041/domains/dunesdiscoverytourism.com/public_html/ && \
          sshpass -e scp -O -P 65002 -o StrictHostKeyChecking=no -o ConnectTimeout=15 deploy/public_deploy/public.zip deploy/public_deploy/unzip.php u410503041@${{ steps.ftp_server.outputs.host }}:/home/u410503041/public_html/ && break || sleep 5
        done

    - name: Package & Upload Images (Always Sync)
      env:
        SSHPASS: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
      run: |
        # Package public/images
        cd public
        zip -r ../images.zip images
        cd ..
        
        for i in 1 2 3; do
          sshpass -e scp -C -O -P 65002 -o StrictHostKeyChecking=no -o ConnectTimeout=15 images.zip u410503041@${{ steps.ftp_server.outputs.host }}:/home/u410503041/domains/dunesdiscoverytourism.com/public_html/ && \
          sshpass -e ssh -p 65002 -o StrictHostKeyChecking=no -o ConnectTimeout=15 u410503041@${{ steps.ftp_server.outputs.host }} "unzip -o /home/u410503041/domains/dunesdiscoverytourism.com/public_html/images.zip -d /home/u410503041/domains/dunesdiscoverytourism.com/public_html/ && rm -f /home/u410503041/domains/dunesdiscoverytourism.com/public_html/images.zip" && break || sleep 5
        done

    - name: Upload Core Laravel Code (SCP)
      env:
        SSHPASS: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
      run: |
        for i in 1 2 3; do
          sshpass -e scp -O -P 65002 -o StrictHostKeyChecking=no -o ConnectTimeout=15 deploy/core_deploy/core.zip u410503041@${{ steps.ftp_server.outputs.host }}:/home/u410503041/domains/dunesdiscoverytourism.com/dunes-laravel/ && break || sleep 5
        done

    - name: Extract Code Zips & Rebuild Laravel Cache (Direct SSH)
      env:
        SSHPASS: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
      run: |
        for i in 1 2 3; do
          sshpass -e ssh -p 65002 -o StrictHostKeyChecking=no -o ConnectTimeout=15 u410503041@${{ steps.ftp_server.outputs.host }} "chmod -R 0777 /home/u410503041/domains/dunesdiscoverytourism.com/public_html /home/u410503041/domains/dunesdiscoverytourism.com/dunes-laravel /home/u410503041/public_html && cd /home/u410503041/domains/dunesdiscoverytourism.com/public_html && unzip -o public.zip && rm -f public.zip && cd /home/u410503041/public_html && unzip -o public.zip && rm -f public.zip && cd /home/u410503041/domains/dunesdiscoverytourism.com/dunes-laravel && unzip -o core.zip && rm -f core.zip && rm -rf storage/framework/views/* && mkdir -p storage/framework/views && chmod -R 0777 storage/framework/views && php artisan db:seed --class=BlogSeeder --force && php artisan db:seed --class=ReviewSeeder --force && php artisan config:clear && php artisan route:clear && php artisan view:clear && php artisan view:cache && php artisan event:clear" && break || sleep 5
        done

    - name: Update asset cache version and flush server cache
      run: |
        curl -sS "https://dunesdiscoverytourism.com/increment_cache.php?key=dunes2026"


